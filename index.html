<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TargetiX OS — Прошивка устройства</title>

  <!-- Скрипт мгновенной установки темы (предотвращает мигание) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      const theme = savedTheme ? savedTheme : (systemPrefersLight ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m12 8 4 4-4 4'/><path d='M8 12h8'/></svg>">

  <!-- Шрифт Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Динамические темы UI */
    :root[data-theme="dark"] {
      --bg: #07090e;
      --card-bg: rgba(15, 23, 36, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.18);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --input-bg: rgba(10, 15, 26, 0.6);
      --dropdown-hover: rgba(59, 130, 246, 0.12);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      --skeleton-bg: rgba(255, 255, 255, 0.04);
      --inner-card-bg: rgba(8, 12, 20, 0.5);
    }

    :root[data-theme="light"] {
      --bg: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(203, 213, 225, 0.8);
      --card-border-hover: rgba(148, 163, 184, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.2);
      --input-bg: #ffffff;
      --dropdown-hover: rgba(37, 99, 235, 0.08);
      --shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
      --skeleton-bg: rgba(0, 0, 0, 0.05);
      --inner-card-bg: rgba(248, 250, 252, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* Исключаем прокрутку страницы */
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Фоновые размытые сферы (Glow Effects) */
    .bg-glow-1 {
      position: absolute;
      width: 450px;
      height: 450px;
      background: var(--primary);
      filter: blur(160px);
      opacity: 0.18;
      top: 10%;
      left: 15%;
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      width: 350px;
      height: 350px;
      background: #8b5cf6;
      filter: blur(150px);
      opacity: 0.12;
      bottom: 10%;
      right: 15%;
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }

    .main-container {
      max-width: 860px;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Главная стеклянная карточка */
    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: background 0.3s ease, border-color 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Шапка карточки */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      color: var(--primary);
      filter: drop-shadow(0 0 8px var(--primary-glow));
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .theme-toggle-btn {
      background: var(--inner-card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 10px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .theme-toggle-btn svg {
      width: 14px;
      height: 14px;
      stroke: var(--primary);
      fill: none;
    }

    /* Двухколоночный макет (Grid Layout) */
    .card-grid {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 680px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Левая колонка: Пьюр фото и USB status */
    .left-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .device-img-wrapper {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      height: 140px;
      background-color: var(--skeleton-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .device-img-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
      animation: skeleton-shimmer 1.5s infinite;
      z-index: 1;
    }

    .device-img-wrapper.loaded::before {
      display: none;
    }

    @keyframes skeleton-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .device-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .device-img-wrapper.loaded .device-img {
      opacity: 1;
    }

    .device-img-wrapper:hover .device-img {
      transform: scale(1.04);
    }

    /* Индикатор USB */
    .usb-status-card {
      background: var(--inner-card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
    }

    .usb-status-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-indicatorDisconnected,
    .status-indicatorConnected {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .status-indicatorDisconnected {
      background-color: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
    }

    .status-indicatorConnected {
      background-color: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.7);
      animation: pulse-green 2s infinite;
    }

    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    .usb-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.3;
    }

    .usb-hint strong {
      color: var(--primary);
    }

    /* Правая колонка: Элементы управления и Changelog */
    .right-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-group {
      text-align: left;
      position: relative;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 5px;
    }

    /* Кастомный селект */
    .custom-select-wrapper {
      position: relative;
      user-select: none;
    }

    .custom-select-wrapper select {
      display: none;
    }

    .custom-select-trigger {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .custom-select-trigger:hover {
      border-color: var(--card-border-hover);
    }

    .custom-select-wrapper.open .custom-select-trigger {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .custom-select-trigger .arrow {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .custom-select-wrapper.open .arrow {
      transform: rotate(180deg);
      stroke: var(--primary);
    }

    .custom-options {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-4px);
      transition: all 0.15s ease;
      z-index: 50;
      overflow: hidden;
      padding: 4px;
      max-height: 160px;
      overflow-y: auto;
    }

    .custom-select-wrapper.open .custom-options {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .custom-option {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease;
    }

    .custom-option:hover {
      background: var(--dropdown-hover);
    }

    .custom-option.selected {
      background: var(--primary-glow);
      color: var(--primary);
      font-weight: 600;
    }

    .custom-option .check-icon {
      width: 14px;
      height: 14px;
      opacity: 0;
      stroke: var(--primary);
    }

    .custom-option.selected .check-icon {
      opacity: 1;
    }

    /* Changelog с микро-скроллом */
    .changelog-card {
      background: var(--inner-card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .changelog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--card-border);
    }

    .changelog-title-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .changelog-icon {
      width: 14px;
      height: 14px;
      stroke: var(--primary);
    }

    .changelog-title {
      font-size: 12px;
      font-weight: 600;
    }

    .version-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 12px;
      background: var(--primary-glow);
      color: var(--primary);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .changelog-body {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 90px;
      overflow-y: auto;
      padding-right: 4px;
      transition: opacity 0.15s ease;
    }

    .changelog-body::-webkit-scrollbar {
      width: 4px;
    }
    .changelog-body::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }

    .changelog-body.updating {
      opacity: 0;
    }

    .changelog-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 12px;
      line-height: 1.35;
    }

    .tag {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .tag-feat { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .tag-fix  { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .tag-impr { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
    .tag-dev  { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }

    .changelog-text-content {
      color: var(--text-main);
    }

    /* Кнопка прошивки */
    esp-web-install-button {
      margin-top: 4px;
    }

    esp-web-install-button button {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    esp-web-install-button button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    esp-web-install-button button:active {
      transform: translateY(0);
    }

    .unsupported-msg {
      color: #ef4444;
      font-size: 11px;
      display: block;
      margin-top: 4px;
    }

    footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.8;
    }
  </style>

  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
  ></script>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="main-container">
    <div class="card">
      
      <!-- Хедер -->
      <div class="card-header">
        <div class="brand-title">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><path d="m12 8 4 4-4 4"/><path d="M8 12h8"/>
          </svg>
          <div>
            <h1>TargetiX OS</h1>
            <div class="brand-subtitle">Подключите устройство через USB для загрузки ПО</div>
          </div>
        </div>

        <button class="theme-toggle-btn" id="theme-toggle" title="Сменить тему">
          <svg id="theme-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
          <span id="theme-text">Тёмная</span>
        </button>
      </div>

      <!-- Главная сетка -->
      <div class="card-grid">
        
        <!-- Левая колонка -->
        <div class="left-col">
          <div class="device-img-wrapper" id="img-wrapper">
            <img src="device_dev.png" alt="TargetiX" class="device-img" id="device-img">
          </div>

          <div class="usb-status-card" id="usb-status-card">
            <div class="usb-status-header">
              <div class="status-indicatorDisconnected" id="usb-indicator"></div>
              <span id="usb-status-text">Устройство не найдено</span>
            </div>
            <p class="usb-hint" id="usb-hint">
              Если устройство не определяется, зажмите <strong>BOOT</strong> при подключении.
            </p>
          </div>
        </div>

        <!-- Правая колонка -->
        <div class="right-col">
          
          <div class="form-row">
            <!-- Выбор модели -->
            <div class="form-group">
              <label id="device-label">Модель</label>
              <div class="custom-select-wrapper" id="device-select-wrapper">
                <select id="device-select" onchange="onDeviceChange()">
                  <option value="dev" data-manifest="manifest_dev.json" data-img="device_dev.png">TargetiX_DEV</option>
                  <option value="sl1" data-manifest="manifest_sl1.json" data-img="device_sl1.png">TargetiX_SL1</option>
                  <option value="sl2" data-manifest="manifest_sl2.json" data-img="device_sl2.png">TargetiX_SL2</option>
                  <option value="sl3" data-manifest="manifest_sl3.json" data-img="device_sl3.png">TargetiX_SL3</option>
                  <option value="sl4" data-manifest="manifest_sl4.json" data-img="device_sl4.png">TargetiX_SL4</option>
                  <option value="sl5" data-manifest="manifest_sl5.json" data-img="device_sl5.png">TargetiX_SL5</option>
                </select>

                <div class="custom-select-trigger" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="device-label">
                  <span class="selected-text">TargetiX_DEV</span>
                  <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>

                <div class="custom-options" role="listbox"></div>
              </div>
            </div>

            <!-- Выбор версии ПО -->
            <div class="form-group">
              <label id="version-label">Версия ПО</label>
              <div class="custom-select-wrapper" id="version-select-wrapper">
                <select id="version-select" onchange="updateManifest()"></select>

                <div class="custom-select-trigger" tabindex="0" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="version-label">
                  <span class="selected-text">Загрузка...</span>
                  <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>

                <div class="custom-options" role="listbox"></div>
              </div>
            </div>
          </div>

          <!-- Changelog -->
          <div class="changelog-card" id="changelog-card">
            <div class="changelog-header">
              <div class="changelog-title-group">
                <svg class="changelog-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <path d="M12 18v-6"/>
                  <path d="M9 15l3 3 3-3"/>
                </svg>
                <span class="changelog-title" id="changelog-title">Статус ПО</span>
              </div>
              <span class="version-badge" id="changelog-version-badge">v1.0.0</span>
            </div>

            <div class="changelog-body" id="changelog-content">
              <!-- Сюда динамически генерируются пункты -->
            </div>
          </div>

          <!-- Кнопка прошивки -->
          <esp-web-install-button id="installer" manifest="manifest_dev.json">
            <button slot="activate">Подключить и прошить</button>
            <span slot="unsupported" class="unsupported-msg">
              ⚠️ Нужен Chrome, Edge или Brave на ПК (Web Serial API).
            </span>
          </esp-web-install-button>

        </div>

      </div>

    </div>

    <footer>
      TargetiX OS &copy; 2026 • Web Flasher
    </footer>
  </div>

  <script>
    let deviceVersions = {};

    // 1. ДИНАМИЧЕСКАЯ ЗАГРУЗКА ВЕРСИЙ
    async function loadDynamicVersions() {
      try {
        const res = await fetch('versions.json?t=' + Date.now());
        if (!res.ok) throw new Error('Файл versions.json не найден');
        deviceVersions = await res.json();
      } catch (e) {
        console.warn('Резервная конфигурация версий...');
        setFallbackVersions();
      } finally {
        restoreSavedDevice();
        onDeviceChange();
      }
    }

    function setFallbackVersions() {
      const devInDev = [{
        value: 'dev',
        label: 'В разработке',
        changes: [
          { type: 'dev', text: 'Прошивка находится в процессе активной разработки.' },
          { type: 'dev', text: 'Следите за обновлениями в официальном репозитории!' }
        ]
      }];

      deviceVersions = {
        dev: devInDev, sl1: devInDev, sl2: devInDev,
        sl3: devInDev, sl4: devInDev, sl5: devInDev
      };
    }

    function restoreSavedDevice() {
      const deviceSelect = document.getElementById('device-select');
      const savedDevice = localStorage.getItem('selected_device');
      if (savedDevice && deviceSelect.querySelector(`option[value="${savedDevice}"]`)) {
        deviceSelect.value = savedDevice;
      }
    }

    // 2. ОБРАБОТКА ИНДИКАТОРА ЗАГРУЗКИ ФОТО
    const imgWrapper = document.getElementById('img-wrapper');
    const deviceImg = document.getElementById('device-img');

    function handleImageLoad() {
      imgWrapper.classList.add('loaded');
    }

    if (deviceImg.complete) {
      handleImageLoad();
    } else {
      deviceImg.addEventListener('load', handleImageLoad);
      deviceImg.addEventListener('error', handleImageLoad);
    }

    // 3. ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ (DARK / LIGHT)
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');
    const htmlEl = document.documentElement;

    const sunIcon = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
    const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

    function updateThemeUI(theme) {
      if (theme === 'light') {
        themeIcon.innerHTML = moonIcon;
        themeText.textContent = 'Тёмная';
      } else {
        themeIcon.innerHTML = sunIcon;
        themeText.textContent = 'Светлая';
      }
    }

    updateThemeUI(htmlEl.getAttribute('data-theme'));

    themeBtn.addEventListener('click', () => {
      const currentTheme = htmlEl.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      htmlEl.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeUI(newTheme);
    });

    // 4. ИНИЦИАЛИЗАЦИЯ И РЕНДЕР КАСТОМНОГО ДРОПДАУНА
    function initCustomSelect(wrapper) {
      const realSelect = wrapper.querySelector('select');
      const optionsContainer = wrapper.querySelector('.custom-options');
      
      optionsContainer.innerHTML = '';

      Array.from(realSelect.options).forEach((opt, index) => {
        const optionEl = document.createElement('div');
        optionEl.classList.add('custom-option');
        optionEl.setAttribute('role', 'option');
        if (index === realSelect.selectedIndex) {
          optionEl.classList.add('selected');
          optionEl.setAttribute('aria-selected', 'true');
        } else {
          optionEl.setAttribute('aria-selected', 'false');
        }
        
        optionEl.innerHTML = `
          <span>${opt.textContent}</span>
          <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        `;

        optionEl.addEventListener('click', (e) => {
          e.stopPropagation();
          realSelect.selectedIndex = index;
          syncCustomSelect(wrapper);
          closeDropdown(wrapper);
          realSelect.dispatchEvent(new Event('change'));
        });

        optionsContainer.appendChild(optionEl);
      });

      syncCustomSelect(wrapper);
    }

    function syncCustomSelect(wrapper) {
      const realSelect = wrapper.querySelector('select');
      const triggerText = wrapper.querySelector('.selected-text');
      const optionsContainer = wrapper.querySelector('.custom-options');
      
      if (!realSelect.options.length) return;

      const selectedOption = realSelect.options[realSelect.selectedIndex] || realSelect.options[0];
      if (triggerText) triggerText.textContent = selectedOption.textContent;

      const customOptions = optionsContainer.querySelectorAll('.custom-option');
      customOptions.forEach((optEl, idx) => {
        if (idx === realSelect.selectedIndex) {
          optEl.classList.add('selected');
          optEl.setAttribute('aria-selected', 'true');
        } else {
          optEl.classList.remove('selected');
          optEl.setAttribute('aria-selected', 'false');
        }
      });
    }

    function openDropdown(wrapper) {
      const trigger = wrapper.querySelector('.custom-select-trigger');
      wrapper.classList.add('open');
      trigger.setAttribute('aria-expanded', 'true');
    }

    function closeDropdown(wrapper) {
      const trigger = wrapper.querySelector('.custom-select-trigger');
      wrapper.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
    }

    // 5. ИНДИКАТОР ПОДКЛЮЧЕНИЯ USB (WEB SERIAL API)
    function initUSBTracking() {
      const indicator = document.getElementById('usb-indicator');
      const statusText = document.getElementById('usb-status-text');
      const usbHint = document.getElementById('usb-hint');

      if (!('serial' in navigator)) {
        indicator.className = 'status-indicatorDisconnected';
        statusText.textContent = 'API не поддерживается';
        usbHint.textContent = 'Используйте Chrome или Edge на компьютере.';
        return;
      }

      async function checkPorts() {
        try {
          const ports = await navigator.serial.getPorts();
          if (ports.length > 0) setConnectedState();
          else setDisconnectedState();
        } catch (e) {
          console.warn('Ошибка проверки портов:', e);
        }
      }

      function setConnectedState() {
        indicator.className = 'status-indicatorConnected';
        statusText.textContent = 'USB подключено';
        usbHint.innerHTML = 'Готово к прошивке. Зажмите <strong>BOOT</strong>, если не стартует.';
      }

      function setDisconnectedState() {
        indicator.className = 'status-indicatorDisconnected';
        statusText.textContent = 'Устройство не найдено';
        usbHint.innerHTML = 'Зажмите кнопку <strong>BOOT</strong> при подключении USB кабеля.';
      }

      navigator.serial.addEventListener('connect', setConnectedState);
      navigator.serial.addEventListener('disconnect', setDisconnectedState);
      checkPorts();
    }

    // 6. СОБЫТИЯ И ИНИЦИАЛИЗАЦИЯ
    document.addEventListener('DOMContentLoaded', () => {
      const wrappers = document.querySelectorAll('.custom-select-wrapper');

      wrappers.forEach(wrapper => {
        const trigger = wrapper.querySelector('.custom-select-trigger');
        const realSelect = wrapper.querySelector('select');

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = wrapper.classList.contains('open');
          wrappers.forEach(w => closeDropdown(w));
          if (!isOpen) openDropdown(wrapper);
        });

        trigger.addEventListener('keydown', (e) => {
          if (['ArrowDown', 'ArrowUp', 'Enter', 'Space', 'Escape'].includes(e.code)) {
            e.preventDefault();
          }

          if (e.code === 'Escape') {
            closeDropdown(wrapper);
            return;
          }

          if (e.code === 'Enter' || e.code === 'Space') {
            if (wrapper.classList.contains('open')) {
              closeDropdown(wrapper);
            } else {
              wrappers.forEach(w => closeDropdown(w));
              openDropdown(wrapper);
            }
            return;
          }

          if (e.code === 'ArrowDown' || e.code === 'ArrowUp') {
            if (!wrapper.classList.contains('open')) {
              openDropdown(wrapper);
            }
            const count = realSelect.options.length;
            if (count === 0) return;

            let nextIdx = realSelect.selectedIndex + (e.code === 'ArrowDown' ? 1 : -1);
            if (nextIdx < 0) nextIdx = 0;
            if (nextIdx >= count) nextIdx = count - 1;

            realSelect.selectedIndex = nextIdx;
            syncCustomSelect(wrapper);
            realSelect.dispatchEvent(new Event('change'));
          }
        });

        initCustomSelect(wrapper);
      });

      document.addEventListener('click', (e) => {
        wrappers.forEach(wrapper => {
          if (!wrapper.contains(e.target)) closeDropdown(wrapper);
        });
      });

      initUSBTracking();
      loadDynamicVersions();
    });

    // 7. СМЕНА УСТРОЙСТВА
    function onDeviceChange() {
      const deviceSelect = document.getElementById('device-select');
      const versionSelect = document.getElementById('version-select');
      const versionWrapper = document.getElementById('version-select-wrapper');

      const selectedDevice = deviceSelect.value;
      localStorage.setItem('selected_device', selectedDevice);

      const versions = deviceVersions[selectedDevice] || deviceVersions['dev'];

      versionSelect.innerHTML = '';
      if (versions) {
        versions.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v.value;
          opt.textContent = v.label;
          if (v.changelog) opt.setAttribute('data-changelog', v.changelog);
          if (v.manifest) opt.setAttribute('data-manifest', v.manifest);
          versionSelect.appendChild(opt);
        });
      }

      initCustomSelect(versionWrapper);
      updateManifest();
    }

    // 8. ОБНОЛЕНИЕ МАНИФЕСТА И CHANGELOG
    function updateManifest() {
      const deviceSelect = document.getElementById('device-select');
      const versionSelect = document.getElementById('version-select');
      const installer = document.getElementById('installer');
      
      const changelogTitle = document.getElementById('changelog-title');
      const changelogBadge = document.getElementById('changelog-version-badge');
      const changelogContent = document.getElementById('changelog-content');

      const selectedDeviceOpt = deviceSelect.options[deviceSelect.selectedIndex];
      const selectedVersionOpt = versionSelect.options[versionSelect.selectedIndex];

      if (!selectedDeviceOpt || !selectedVersionOpt) return;

      const versionManifest = selectedVersionOpt.getAttribute('data-manifest');
      const deviceManifest = selectedDeviceOpt.getAttribute('data-manifest');
      const manifestPath = versionManifest || deviceManifest || 'manifest_dev.json';

      installer.setAttribute('manifest', manifestPath);

      const newImgSrc = selectedDeviceOpt.getAttribute('data-img');
      if (newImgSrc && deviceImg.getAttribute('src') !== newImgSrc) {
        imgWrapper.classList.remove('loaded');
        deviceImg.src = newImgSrc;
      }

      changelogContent.classList.add('updating');

      setTimeout(() => {
        const selectedDevice = deviceSelect.value;
        const selectedVersionVal = versionSelect.value;
        
        const versions = deviceVersions[selectedDevice] || [];
        const currentVersionObj = versions.find(v => v.value === selectedVersionVal);

        if (selectedVersionVal === 'dev') {
          changelogTitle.textContent = 'Разработка';
          changelogBadge.textContent = 'DEV';
          changelogBadge.style.display = 'inline-block';
          installer.style.display = 'none';
        } else {
          changelogTitle.textContent = 'Что нового';
          changelogBadge.textContent = `v${selectedVersionVal}`;
          changelogBadge.style.display = 'inline-block';
          installer.style.display = 'block';
        }

        changelogContent.innerHTML = '';

        if (currentVersionObj && Array.isArray(currentVersionObj.changes)) {
          currentVersionObj.changes.forEach(change => {
            const item = document.createElement('div');
            item.className = 'changelog-item';

            let tagHTML = '';
            if (change.type === 'feat') tagHTML = '<span class="tag tag-feat">NEW</span>';
            else if (change.type === 'fix') tagHTML = '<span class="tag tag-fix">FIX</span>';
            else if (change.type === 'impr') tagHTML = '<span class="tag tag-impr">IMPR</span>';
            else if (change.type === 'dev') tagHTML = '<span class="tag tag-dev">INFO</span>';

            item.innerHTML = `
              ${tagHTML}
              <span class="changelog-text-content">${change.text}</span>
            `;
            changelogContent.appendChild(item);
          });
        } else {
          const rawChangelog = selectedVersionOpt.getAttribute('data-changelog') || 'Описание отсутствует.';
          const item = document.createElement('div');
          item.className = 'changelog-item';
          item.innerHTML = `<span class="changelog-text-content">${rawChangelog}</span>`;
          changelogContent.appendChild(item);
        }

        changelogContent.classList.remove('updating');
      }, 100);
    }
  </script>
