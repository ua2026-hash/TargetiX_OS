<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TargetiX OS — Прошивка устройства</title>

  <!-- Скрипт мгновенной установки темы до отрисовки страницы (предотвращает мигание) -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      const theme = savedTheme ? savedTheme : (systemPrefersLight ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='m12 8 4 4-4 4'/><path d='M8 12h8'/></svg>">

  <!-- Шрифт Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Переменные для Тёмной темы (по умолчанию) */
    :root[data-theme="dark"] {
      --bg: #0b0f17;
      --card-bg: rgba(23, 31, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-glow: rgba(59, 130, 246, 0.25);
      --input-bg: rgba(15, 23, 42, 0.6);
      --dropdown-hover: rgba(59, 130, 246, 0.12);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      --skeleton-bg: rgba(255, 255, 255, 0.05);
    }

    /* Переменные для Светлой темы */
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.8);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-glow: rgba(37, 99, 235, 0.2);
      --input-bg: #ffffff;
      --dropdown-hover: rgba(37, 99, 235, 0.08);
      --shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.05);
      --skeleton-bg: rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Фоновый декоративный элемент */
    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: var(--primary);
      filter: blur(140px);
      opacity: 0.2;
      top: 20%;
      z-index: -1;
      border-radius: 50%;
      transition: background 0.3s ease;
    }

    .container {
      max-width: 420px;
      width: 100%;
      position: relative;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    /* Кнопка переключения темы */
    .theme-toggle-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 12px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
    }

    .theme-toggle-btn:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .theme-toggle-btn svg {
      width: 16px;
      height: 16px;
      stroke: var(--primary);
      fill: none;
    }

    /* Индикатор загрузки фото (Skeleton Loader) */
    .device-img-wrapper {
      position: relative;
      margin-bottom: 24px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      height: 190px;
      background-color: var(--skeleton-bg);
    }

    /* Анимация пульсации скелетона */
    .device-img-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
      animation: skeleton-shimmer 1.5s infinite;
      z-index: 1;
    }

    .device-img-wrapper.loaded::before {
      display: none;
    }

    @keyframes skeleton-shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .device-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.4s ease;
      position: relative;
      z-index: 2;
    }

    .device-img-wrapper.loaded .device-img {
      opacity: 1;
    }

    .card:hover .device-img {
      transform: scale(1.03);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
      position: relative;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: block;
      margin-bottom: 8px;
    }

    /* --- КАСТОМНЫЙ ДРОПДАУН --- */
    .custom-select-wrapper {
      position: relative;
      user-select: none;
    }

    .custom-select-wrapper select {
      display: none;
    }

    .custom-select-trigger {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .custom-select-trigger:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .custom-select-wrapper.open .custom-select-trigger {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .custom-select-trigger .arrow {
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }

    .custom-select-wrapper.open .arrow {
      transform: rotate(180deg);
      stroke: var(--primary);
    }

    .custom-options {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px) scale(0.98);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
      overflow: hidden;
      padding: 6px;
    }

    .custom-select-wrapper.open .custom-options {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .custom-option {
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .custom-option:hover {
      background: var(--dropdown-hover);
    }

    .custom-option.selected {
      background: var(--primary-glow);
      color: var(--primary);
      font-weight: 600;
    }

    .custom-option .check-icon {
      width: 16px;
      height: 16px;
      opacity: 0;
      stroke: var(--primary);
      transition: opacity 0.15s ease;
    }

    .custom-option.selected .check-icon {
      opacity: 1;
    }

    /* --- CHANGELOG --- */
    .changelog {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .changelog strong {
      color: var(--text-main);
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* Кнопка прошивки */
    esp-web-install-button button {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px var(--primary-glow);
    }

    esp-web-install-button button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    esp-web-install-button button:active {
      transform: translateY(0);
    }

    .unsupported-msg {
      color: #ef4444;
      font-size: 13px;
      margin-top: 10px;
      display: block;
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
      opacity: 0.7;
    }
  </style>

  <script
    type="module"
    src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"
  ></script>
</head>
<body>

  <div class="container">
    <div class="card">
      <!-- Кнопка переключения темы -->
      <button class="theme-toggle-btn" id="theme-toggle" title="Сменить тему">
        <svg id="theme-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        <span id="theme-text">Тёмная</span>
      </button>

      <!-- Фото устройства с индикатором загрузки -->
      <div class="device-img-wrapper" id="img-wrapper">
        <img src="device.png" alt="TargetiX" class="device-img" id="device-img">
      </div>

      <h1>TargetiX OS</h1>
      <p class="subtitle">Подключите устройство через USB для загрузки или обновления системы.</p>

      <!-- Выбор модели устройства -->
      <div class="form-group">
        <label>Модель устройства</label>
        
        <div class="custom-select-wrapper" id="device-select-wrapper">
          <select id="device-select" onchange="onDeviceChange()">
            <option value="dev" data-manifest="manifest_dev.json" data-img="device.png">TargetiX_DEV</option>
            <option value="sl2" data-manifest="manifest_sl2.json" data-img="device_sl2.png">TargetiX_SL2</option>
            <option value="sl3" data-manifest="manifest_sl3.json" data-img="device_sl3.png">TargetiX_SL3</option>
          </select>

          <div class="custom-select-trigger">
            <span class="selected-text">TargetiX_DEV</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

          <div class="custom-options"></div>
        </div>
      </div>

      <!-- Выбор версии ПО -->
      <div class="form-group">
        <label>Версия ПО</label>
        
        <div class="custom-select-wrapper" id="version-select-wrapper">
          <select id="version-select" onchange="updateManifest()"></select>

          <div class="custom-select-trigger">
            <span class="selected-text">Загрузка...</span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

          <div class="custom-options"></div>
        </div>
      </div>

      <!-- Changelog -->
      <div class="changelog" id="changelog-box">
        <strong id="changelog-title">Статус ПО:</strong>
        <span id="changelog-text">Загрузка...</span>
      </div>

      <!-- Кнопка прошивки -->
      <esp-web-install-button id="installer" manifest="manifest_dev.json">
        <button slot="activate">Подключить и прошить</button>
        <span slot="unsupported" class="unsupported-msg">
          ⚠️ Браузер не поддерживает Web Serial. Используйте Chrome, Edge или Brave на ПК.
        </span>
      </esp-web-install-button>
    </div>

    <footer>
      TargetiX OS &copy; 2026 • Web Flasher
    </footer>
  </div>

  <script>
    // Конфигурация версий для каждого устройства
    const deviceVersions = {
      dev: [
        {
          value: '2.6',
          label: 'v2.6 (Релиз)',
          changelog: '• Полная поддержка TargetiX_DEV (Bootloader + Partitions)<br>• Основная функциональность системы<br>• Оптимизация стабильности Web Serial'
        },
        {
          value: 'dev',
          label: 'В разработке',
          changelog: '• Прошивка для данного устройства находится в процессе разработки.<br>• Следите за обновлениями!'
        }
      ],
      sl2: [
        {
          value: 'dev',
          label: 'В разработке',
          changelog: '• Прошивка для данного устройства находится в процессе разработки.<br>• Следите за обновлениями!'
        }
      ],
      sl3: [
        {
          value: 'dev',
          label: 'В разработке',
          changelog: '• Прошивка для данного устройства находится в процессе разработки.<br>• Следите за обновлениями!'
        }
      ]
    };

    // --- 1. ОБРАБОТКА ИНДИКАТОРА ЗАГРУЗКИ ФОТО ---
    const imgWrapper = document.getElementById('img-wrapper');
    const deviceImg = document.getElementById('device-img');

    function handleImageLoad() {
      imgWrapper.classList.add('loaded');
    }

    if (deviceImg.complete) {
      handleImageLoad();
    } else {
      deviceImg.addEventListener('load', handleImageLoad);
      deviceImg.addEventListener('error', handleImageLoad);
    }

    // --- 2. ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ (DARK / LIGHT) ---
    const themeBtn = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');
    const htmlEl = document.documentElement;

    const sunIcon = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
    const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

    function updateThemeUI(theme) {
      if (theme === 'light') {
        themeIcon.innerHTML = moonIcon;
        themeText.textContent = 'Тёмная';
      } else {
        themeIcon.innerHTML = sunIcon;
        themeText.textContent = 'Светлая';
      }
    }

    updateThemeUI(htmlEl.getAttribute('data-theme'));

    themeBtn.addEventListener('click', () => {
      const currentTheme = htmlEl.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      htmlEl.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeUI(newTheme);
    });

    // --- 3. ИНИЦИАЛИЗАЦИЯ И РЕНДЕР КАСТОМНОГО ДРОПДАУНА ---
    function initCustomSelect(wrapper) {
      const realSelect = wrapper.querySelector('select');
      const optionsContainer = wrapper.querySelector('.custom-options');
      
      optionsContainer.innerHTML = '';

      Array.from(realSelect.options).forEach((opt, index) => {
        const optionEl = document.createElement('div');
        optionEl.classList.add('custom-option');
        if (index === realSelect.selectedIndex) optionEl.classList.add('selected');
        
        optionEl.innerHTML = `
          <span>${opt.textContent}</span>
          <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        `;

        optionEl.addEventListener('click', (e) => {
          e.stopPropagation();
          realSelect.selectedIndex = index;
          syncCustomSelect(wrapper);
          wrapper.classList.remove('open');
          realSelect.dispatchEvent(new Event('change'));
        });

        optionsContainer.appendChild(optionEl);
      });

      syncCustomSelect(wrapper);
    }

    function syncCustomSelect(wrapper) {
      const realSelect = wrapper.querySelector('select');
      const triggerText = wrapper.querySelector('.selected-text');
      const optionsContainer = wrapper.querySelector('.custom-options');
      
      if (!realSelect.options.length) return;

      const selectedOption = realSelect.options[realSelect.selectedIndex] || realSelect.options[0];
      if (triggerText) triggerText.textContent = selectedOption.textContent;

      const customOptions = optionsContainer.querySelectorAll('.custom-option');
      customOptions.forEach((optEl, idx) => {
        if (idx === realSelect.selectedIndex) {
          optEl.classList.add('selected');
        } else {
          optEl.classList.remove('selected');
        }
      });
    }

    // --- 4. СОБЫТИЯ И ИНИЦИАЛИЗАЦИЯ ---
    document.addEventListener('DOMContentLoaded', () => {
      const wrappers = document.querySelectorAll('.custom-select-wrapper');

      wrappers.forEach(wrapper => {
        const trigger = wrapper.querySelector('.custom-select-trigger');

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          wrappers.forEach(w => {
            if (w !== wrapper) w.classList.remove('open');
          });
          wrapper.classList.toggle('open');
        });

        initCustomSelect(wrapper);
      });

      document.addEventListener('click', (e) => {
        wrappers.forEach(wrapper => {
          if (!wrapper.contains(e.target)) {
            wrapper.classList.remove('open');
          }
        });
      });

      // Инициализируем версии для текущего устройства при старте
      onDeviceChange();
    });

    // --- 5. ФУНКЦИЯ ОБНОВЛЕНИЯ ВЕРСИЙ ПРИ СМЕНЕ УСТРОЙСТВА ---
    function onDeviceChange() {
      const deviceSelect = document.getElementById('device-select');
      const versionSelect = document.getElementById('version-select');
      const versionWrapper = document.getElementById('version-select-wrapper');

      const selectedDevice = deviceSelect.value;
      const versions = deviceVersions[selectedDevice] || deviceVersions['dev'];

      // Заполняем <option> для элемента версий
      versionSelect.innerHTML = '';
      versions.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.value;
        opt.textContent = v.label;
        opt.setAttribute('data-changelog', v.changelog);
        versionSelect.appendChild(opt);
      });

      // Перестраиваем кастомный интерфейс выпадающего списка
      initCustomSelect(versionWrapper);

      // Обновляем манифест, картинку и changelog
      updateManifest();
    }

    // --- 6. ФУНКЦИЯ ОБНОВЛЕНИЯ МАНИФЕСТА И CHANGELOG ---
    function updateManifest() {
      const deviceSelect = document.getElementById('device-select');
      const versionSelect = document.getElementById('version-select');
      const installer = document.getElementById('installer');
      const changelogText = document.getElementById('changelog-text');
      const changelogTitle = document.getElementById('changelog-title');

      const selectedDeviceOpt = deviceSelect.options[deviceSelect.selectedIndex];
      const selectedVersionOpt = versionSelect.options[versionSelect.selectedIndex];

      if (!selectedDeviceOpt || !selectedVersionOpt) return;

      // Смена манифеста в зависимости от устройства
      const manifestPath = selectedDeviceOpt.getAttribute('data-manifest') || 'manifest_dev.json';
      installer.setAttribute('manifest', manifestPath);

      // Смена картинки при выборе устройства
      const newImgSrc = selectedDeviceOpt.getAttribute('data-img');
      if (newImgSrc && deviceImg.getAttribute('src') !== newImgSrc) {
        imgWrapper.classList.remove('loaded');
        deviceImg.src = newImgSrc;
      }

      // Смена changelog
      const changelog = selectedVersionOpt.getAttribute('data-changelog');
      const versionValue = selectedVersionOpt.value;
      
      if (versionValue === 'dev') {
        changelogTitle.textContent = 'Статус ПО:';
      } else {
        changelogTitle.textContent = `Что нового в v${versionValue}:`;
      }

      if (changelog) {
        changelogText.innerHTML = changelog;
      }
    }
  </script>

</body>
</html>
